name: Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $appVersion = python -c "from utils.constants import APP_VERSION; print(APP_VERSION)"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v', 'V')
          if ($appVersion.Trim() -ne $tagVersion) {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $appVersion"
          }

      - name: Build onefile executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean "국가법령정보 통합검색.spec"

      - name: Prepare release assets, source, and build information
        shell: pwsh
        run: |
          # GitHub은 Release 자산 이름에서 한글과 공백을 잘라내므로 업로드용
          # 사본은 반드시 ASCII 이름(law-search-ai.exe)으로 만든다. 이 이름이
          # utils/constants.py의 UPDATE_ASSET_NAME과 정확히 같아야 한다.
          $source = "dist\국가법령정보 통합검색.exe"
          $releaseExe = "dist\law-search-ai.exe"
          $checksum = "dist\law-search-ai.exe.sha256"
          $sourceArchive = "dist\law-search-ai-source-$env:GITHUB_REF_NAME.zip"
          $buildInfo = "dist\law-search-ai-build-info.txt"
          Copy-Item -LiteralPath $source -Destination $releaseExe -Force
          $assetName = python -c "from utils.constants import UPDATE_ASSET_NAME; print(UPDATE_ASSET_NAME)"
          if ($assetName.Trim() -ne "law-search-ai.exe") {
            throw "UPDATE_ASSET_NAME $assetName does not match the uploaded asset name law-search-ai.exe"
          }
          $hash = (Get-FileHash -LiteralPath $releaseExe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksum -Value "$hash  law-search-ai.exe" -Encoding utf8
          git archive --format=zip --output=$sourceArchive HEAD
          $pythonVersion = python --version
          $pysideVersion = python -c "import PySide6; print(PySide6.__version__)"
          $pyinstallerVersion = python -m PyInstaller --version
          @(
            "Release: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            "Python: $pythonVersion"
            "PySide6: $pysideVersion"
            "PyInstaller: $pyinstallerVersion"
            "Build command: python -m PyInstaller --noconfirm --clean 국가법령정보 통합검색.spec"
            "Qt/PySide6 source offer: docs/QT_SOURCE_OFFER.md"
          ) | Set-Content -LiteralPath $buildInfo -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "dist\law-search-ai.exe"
          $checksum = "dist\law-search-ai.exe.sha256"
          $sourceArchive = "dist\law-search-ai-source-$tag.zip"
          $buildInfo = "dist\law-search-ai-build-info.txt"
          gh release create $tag $exe $checksum $sourceArchive $buildInfo --verify-tag --generate-notes --title $tag
