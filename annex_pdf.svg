<!-- 아래 여백은 일부러 비워 둔 자리다. 별표 목록 줄은 줄간격이 1.35라
     글자가 줄 상자 위쪽에 앉는데, 가운데 맞춘 아이콘은 상자 한가운데
     그려져 글자보다 아래로 처진다. 상자 아래를 늘려 글자 높이에 맞춘다.
     HTML에서 그리는 높이(마커 21, 내려받기 22)와 짝이 맞아야 한다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 0 190 261.25" width="20" height="27.5">
  <title>PDF 다운로드 아이콘</title>

  <!-- 문서 외곽 -->
  <path d="M18 4 H111 Q117 4 122 9 L151 38 Q156 43 156 50 V172
           Q156 185 143 185 H18 Q4 185 4 171 V18 Q4 4 18 4 Z"
        fill="#F7F7F7"
        stroke="#FF2A20"
        stroke-width="6"
        stroke-linejoin="round"/>

  <!-- PDF 심볼 -->
  <path d="M76 35
           C70 36 70 48 75 59
           C78 67 82 75 87 81
           C95 80 104 80 111 82
           C122 85 119 92 111 92
           C103 92 94 88 87 85
           C78 88 69 92 61 97
           C55 106 49 112 43 113
           C35 114 34 109 40 103
           C45 98 53 95 59 92
           C64 83 70 71 74 61
           C71 53 68 45 70 40
           C71 36 73 35 76 35 Z
           M75 60
           C72 70 68 80 63 89
           C70 86 77 83 84 81
           C80 75 77 68 75 60 Z"
        fill="none"
        stroke="#FF2A20"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- 더 크게 만든 PDF -->
  <text x="80" y="166"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="47"
        font-weight="700"
        letter-spacing="-2"
        fill="#222222">PDF</text>
</svg>
